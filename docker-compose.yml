# Продакшен: docker compose up -d   (настройки — в .env, см. .env.example и DEPLOY.md)
#
#   интернет ─▶ caddy (80/443, HTTPS) ─▶ app ×N ─▶ postgres
#                                          └────▶ runner (изолированная сеть, без интернета)

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?укажите DOMAIN в .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [app]
    networks: [web]

  app:
    build: { context: ., dockerfile: Dockerfile }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://algotrain:${POSTGRES_PASSWORD:?укажите POSTGRES_PASSWORD}@db:5432/algotrain?sslmode=disable
      RUNNER_URL: http://runner:8081
      RUNNER_TOKEN: ${RUNNER_TOKEN:?укажите RUNNER_TOKEN}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
      RUNS_PER_MINUTE: ${RUNS_PER_MINUTE:-20}
      DB_MAX_CONNS: ${DB_MAX_CONNS:-20}
    deploy:
      replicas: ${APP_REPLICAS:-2}
      resources: { limits: { cpus: "2", memory: 512M } }
    depends_on:
      db: { condition: service_healthy }
      runner: { condition: service_started }
    healthcheck:
      test: ["CMD", "/algotrain", "-healthcheck"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks: [web, backend, sandbox]

  runner:
    build: { context: ., dockerfile: Dockerfile.runner }
    restart: unless-stopped
    environment:
      RUNNER_TOKEN: ${RUNNER_TOKEN:?укажите RUNNER_TOKEN}
      RUNNER_WORKERS: ${RUNNER_WORKERS:-4}
      GOCACHE_LIMIT_MB: "1024"
    # изоляция: без интернета (internal-сеть), файловая система только для чтения,
    # минимальный набор capabilities, лимиты процессов/памяти/CPU
    # init (tini) подбирает осиротевшие процессы решений, иначе копятся зомби
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /jobs:size=512m,mode=0711,exec
      - /cache:size=1536m,mode=0755,uid=1001,gid=1001
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER, DAC_OVERRIDE, KILL]
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources: { limits: { cpus: "${RUNNER_CPUS:-4}", memory: 3G, pids: 1024 } }
    networks: [sandbox]

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: algotrain
      POSTGRES_USER: algotrain
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?укажите POSTGRES_PASSWORD}
    command: ["postgres", "-c", "max_connections=200", "-c", "shared_buffers=256MB"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrain -d algotrain"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [backend]

networks:
  web: {}
  backend: { internal: true }   # БД недоступна снаружи и из раннера
  sandbox: { internal: true }   # у раннера нет выхода в интернет

volumes:
  pgdata: {}
  caddy_data: {}
  caddy_config: {}
